# docker-compose.yml
#
# Прод-стек DOPX одной командой: `docker compose up -d --build`.
# Все сервисы сидят в одной изолированной docker-сети (dopx_net) и видят
# друг друга по именам сервисов (db, redis, web...) — это и есть DNS
# внутри Docker, отдельно настраивать ничего не нужно.
#
# Наружу торчит только nginx, и только на 127.0.0.1:8080 (см. сервис nginx
# ниже) — потому что на сервере отдельно стоит aaPanel со своим родным
# веб-сервером, который сам занимает 80/443 и умеет reverse proxy + SSL
# (см. docs/DEPLOYMENT.md, раздел "Деплой с aaPanel"). Если разворачиваешь
# БЕЗ aaPanel, на голом VPS — поменяй порт nginx ниже на "80:80" (и
# TRUSTED_PROXY_COUNT в .env обратно на 1, см. .env.example). Postgres,
# Redis и сам Django-процесс (web:8000) снаружи недоступны напрямую в
# любом случае — единственная дверь в систему — nginx.

services:
  # ==========================================================================
  # PostgreSQL — основная база данных
  # ==========================================================================
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dopx_net

  # ==========================================================================
  # Redis — три роли одновременно: Celery broker (db 0), Django cache (db 1),
  # кэш агрегатов (db 2). См. dopx/settings.py CACHES/CELERY_BROKER_URL —
  # один процесс Redis спокойно держит несколько логических БД по номеру.
  # ==========================================================================
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - dopx_net

  # ==========================================================================
  # Django + gunicorn — сам сайт
  # ==========================================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Внутри Docker-сети хосты БД/Redis всегда называются как сервисы
      # в этом файле, а не как в .env для локальной разработки без Docker.
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/1
      REDIS_AGGREGATES_URL: redis://redis:6379/2
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - static_volume:/app/staticfiles
      - ./media:/app/media
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # /admin/login/ ничего не требует от БД, кроме факта, что подключение
      # к ней вообще есть — не зависит от того, есть ли уже данные
      # (сезоны/матчи) в свежей базе. Используется nginx'ом ниже (depends_on
      # condition: service_healthy), чтобы не начать проксировать трафик
      # на web, пока gunicorn ещё гоняет миграции/collectstatic при
      # первом старте — иначе первые запросы после `docker compose up`
      # ловили бы 502 в течение этого окна.
      test: ["CMD", "curl", "-f", "http://localhost:8000/admin/login/"]
      interval: 10s
      timeout: 5s
      retries: 6
      # 120s — с запасом на холодный старт: миграции по ~22 приложениям
      # + collectstatic --clear на первом запуске могут занять больше
      # исходных 30s, а провал healthcheck в этом окне валит nginx
      # (depends_on: web: condition: service_healthy) при самом первом
      # разворачивании.
      start_period: 120s
    networks:
      - dopx_net

  # ==========================================================================
  # Celery worker — фоновые задачи (парсер KFF, пересчёт агрегатов,
  # уведомления, email-дайджесты и т.д. — см. dopx/settings.py CELERY_BEAT_SCHEDULE)
  # ==========================================================================
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A dopx worker -l info --concurrency=4
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/1
      REDIS_AGGREGATES_URL: redis://redis:6379/2
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ./media:/app/media
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Ждём не только БД, но и полностью готовый web (его healthcheck
      # зелёный только ПОСЛЕ того, как gunicorn там прогнал миграции) —
      # иначе воркер может стартовать раньше и начать разбирать задачи
      # из очереди против схемы БД, которая ещё не накатана.
      web:
        condition: service_healthy
    healthcheck:
      # Без -d (конкретного адресата) — просто "хоть кто-то из воркеров
      # этого контейнера отвечает", не завязываемся на точное имя ноды.
      test: ["CMD-SHELL", "celery -A dopx inspect ping | grep -q OK"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - dopx_net

  # ==========================================================================
  # Celery beat — планировщик, который раз в N минут/часов ставит задачи
  # из CELERY_BEAT_SCHEDULE в очередь для celery_worker выше. Должен
  # существовать РОВНО в одном экземпляре (иначе задачи задублируются) —
  # не увеличивать replicas у этого сервиса.
  # ==========================================================================
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A dopx beat -l info --schedule=/app/celerybeat/celerybeat-schedule
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/1
      REDIS_AGGREGATES_URL: redis://redis:6379/2
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - celerybeat_data:/app/celerybeat
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Та же причина, что у celery_worker выше: beat не должен начать
      # раскладывать задачи по расписанию, пока web ещё не завершил
      # миграции — иначе первые же задачи упадут на несуществующих
      # таблицах/колонках.
      web:
        condition: service_healthy
    networks:
      - dopx_net

  # ==========================================================================
  # nginx — единственная точка входа снаружи. Отдаёт статику/медиа напрямую
  # с диска (быстрее и дешевле, чем гонять их через Django-процесс),
  # остальное проксирует в gunicorn.
  # ==========================================================================
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      # 127.0.0.1: только с самого сервера — снаружи этот порт недоступен,
      # даже если файрвол открыт. Публично сайт отдаёт aaPanel-нжинкс,
      # который проксирует сюда (Website → Reverse Proxy → http://127.0.0.1:8080).
      # Без aaPanel (голый VPS) — верни "80:80" и "443:443" как раньше.
      - "127.0.0.1:8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - ./media:/app/media:ro
      # - ./docker/certbot/conf:/etc/letsencrypt:ro
      # - ./docker/certbot/www:/var/www/certbot:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - dopx_net

volumes:
  postgres_data:
  redis_data:
  static_volume:
  celerybeat_data:
  # media/ и logs/ сознательно НЕ named volume, а bind mount (см. `./media`/
  # `./logs` у сервисов выше) — так контейнер видит те же файлы, что лежат
  # прямо в папке проекта. Во-первых, это даёт локальной разработке
  # преемственность: аватарки/фото игроков, которые уже накопились в
  # media/ при запуске через `manage.py runserver`, не потеряются и не
  # окажутся "невидимыми" при переходе на Docker — та же самая папка.
  # Во-вторых, на сервере логи/медиа лежат обычными файлами, которые видно
  # и можно бэкапить стандартными средствами, а не искать их внутри
  # непрозрачного Docker-хранилища volume'ов.

networks:
  dopx_net:
    driver: bridge
