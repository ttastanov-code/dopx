# docker-compose.yml
#
# Прод-стек: docker compose up -d --build. Сервисы в сети dopx_net видят друг друга по именам.
# Наружу — только nginx на 127.0.0.1:8080 (публично проксирует aaPanel).
# Без aaPanel: порт nginx "80:80" и TRUSTED_PROXY_COUNT=1 в .env.
# Обновление — scripts/deploy.sh (его вызывает GitHub Actions после пуша в main).

# Логи контейнеров: не больше 5 файлов по 20 МБ на сервис, иначе со временем забьют диск.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

# Образ приложения: один для web и всех celery-процессов. Тег — хеш коммита.
x-app-build: &app-build
  context: .
  dockerfile: Dockerfile
  args:
    GIT_SHA: ${GIT_SHA:-dev}
    APP_VERSION: ${APP_VERSION:-dev}

services:
  # ==========================================================================
  # PostgreSQL — основная база данных
  # ==========================================================================
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dopx_net

  # ==========================================================================
  # Redis: Celery broker (db 0), Django cache (db 1), кэш агрегатов (db 2).
  # ==========================================================================
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - dopx_net

  # ==========================================================================
  # Django + gunicorn — сам сайт
  # ==========================================================================
  web:
    build: *app-build
    image: dopx-app:${GIT_SHA:-dev}
    restart: unless-stopped
    logging: *logging
    env_file:
      - .env
    environment:
      # Хосты БД/Redis — имена сервисов этого файла.
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/1
      REDIS_AGGREGATES_URL: redis://redis:6379/2
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      # aaPanel + nginx — два доверенных прокси в X-Forwarded-For.
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-2}
    volumes:
      - static_volume:/app/staticfiles
      - ./media:/app/media
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # /healthz/ проверяет базу и Redis. Host — первый домен из ALLOWED_HOSTS, X-Forwarded-Proto — без редиректа на https.
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -H \"Host: $${ALLOWED_HOSTS%%,*}\" -H 'X-Forwarded-Proto: https' http://localhost:8000/healthz/"]
      interval: 10s
      timeout: 5s
      retries: 6
      # 120s — запас на холодный старт с миграциями.
      start_period: 120s
    networks:
      - dopx_net

  # ==========================================================================
  # Celery worker — фоновые задачи (синк Sportmonks, агрегаты, уведомления)
  # ==========================================================================
  celery_worker:
    build: *app-build
    image: dopx-app:${GIT_SHA:-dev}
    restart: unless-stopped
    logging: *logging
    # Слушает обе очереди; realtime дополнительно обслуживает celery_realtime.
    command: celery -A dopx worker -l info --concurrency=4 -Q realtime,celery
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/1
      REDIS_AGGREGATES_URL: redis://redis:6379/2
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ./media:/app/media
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Ждём здоровый web — чтобы миграции уже были накатаны.
      web:
        condition: service_healthy
    healthcheck:
      # Проверяем, что отвечает хоть один воркер контейнера.
      test: ["CMD-SHELL", "celery -A dopx inspect ping | grep -q OK"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - dopx_net


  # ==========================================================================
  # Celery realtime — live-опрос Sportmonks и пуш-уведомления
  # ==========================================================================
  celery_realtime:
    build: *app-build
    image: dopx-app:${GIT_SHA:-dev}
    restart: unless-stopped
    logging: *logging
    # Только live-опрос и пуши — не ждут за долгими задачами.
    command: celery -A dopx worker -l info --concurrency=2 -Q realtime -n realtime@%h
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/1
      REDIS_AGGREGATES_URL: redis://redis:6379/2
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ./media:/app/media
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Ждём здоровый web — чтобы миграции уже были накатаны.
      web:
        condition: service_healthy
    healthcheck:
      # Проверяем, что отвечает хоть один воркер контейнера.
      test: ["CMD-SHELL", "celery -A dopx inspect ping | grep -q OK"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - dopx_net
  # ==========================================================================
  # Celery beat — ставит задачи по CELERY_BEAT_SCHEDULE. Только один экземпляр.
  # ==========================================================================
  celery_beat:
    build: *app-build
    image: dopx-app:${GIT_SHA:-dev}
    restart: unless-stopped
    logging: *logging
    command: celery -A dopx beat -l info --schedule=/app/celerybeat/celerybeat-schedule
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/1
      REDIS_AGGREGATES_URL: redis://redis:6379/2
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - celerybeat_data:/app/celerybeat
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Ждём web по той же причине, что и worker.
      web:
        condition: service_healthy
    networks:
      - dopx_net

  # ==========================================================================
  # nginx — точка входа: статика/медиа с диска, остальное в gunicorn.
  # ==========================================================================
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      # Только 127.0.0.1 — публично отдаёт aaPanel (Reverse Proxy -> http://127.0.0.1:8080).
      # Без aaPanel — "80:80" и "443:443".
      - "127.0.0.1:8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - ./media:/app/media:ro
      # - ./docker/certbot/conf:/etc/letsencrypt:ro
      # - ./docker/certbot/www:/var/www/certbot:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - dopx_net

volumes:
  postgres_data:
  redis_data:
  static_volume:
  celerybeat_data:
  # media/ и logs/ — bind mount: те же файлы, что в папке проекта, удобно бэкапить.

networks:
  dopx_net:
    driver: bridge
