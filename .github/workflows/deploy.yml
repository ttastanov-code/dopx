# .github/workflows/deploy.yml
#
# На push в main/dev и PR: сборка образа, тесты на Postgres/Redis, deploy-чеклист.
# Если всё прошло и это push в main — на сервере по SSH запускается scripts/deploy.sh <коммит>
# (сборка, бэкап БД, миграции, перезапуск, проверка /healthz/, откат при сбое). См. docs/DEPLOYMENT.md.
# Без секретов DEPLOY_HOST/DEPLOY_USER/DEPLOY_SSH_KEY/DEPLOY_PATH деплой пропускается.
# TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID (необязательно) — уведомление, если упали тесты.
#
# Версии: первый деплой — v1.0.0, дальше каждый деплой +0.0.1. «[minor]» в сообщении коммита — +0.1.0,
# «[major]» — +1.0.0. После успешного деплоя создаются тег vX.Y.Z и GitHub Release со списком изменений.

name: Build check & deploy

on:
  push:
    branches:
      - main
      - dev
  # Проверки и на PR. Деплой на PR не запустится: github.ref там refs/pull/N/merge.
  pull_request:
    branches:
      - main
      - dev
  # Ручной запуск (кнопка в GitHub или Telegram-бот). ref — тег vX.Y.Z для отката; пусто — последний main.
  workflow_dispatch:
    inputs:
      ref:
        description: "Тег vX.Y.Z для отката (пусто — выкатить последний main)"
        required: false
        default: ""

jobs:
  build-check:
    name: Проверка сборки Docker-образа
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Собрать образ web (без запуска)
        run: docker build -t dopx-build-check .

  test:
    name: Тесты + Django deploy-чеклист
    runs-on: ubuntu-latest
    # Postgres/Redis прямо на раннере — проверяем код, Dockerfile проверяет build-check.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dopx_test
          POSTGRES_USER: dopx_test
          POSTGRES_PASSWORD: dopx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dopx_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Тестовые значения, не секреты. ENVIRONMENT=development — не требуем прод-SECRET_KEY.
      ENVIRONMENT: development
      DEBUG: "True"
      SECRET_KEY: ci-test-secret-key-not-for-production-use
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      DB_NAME: dopx_test
      DB_USER: dopx_test
      DB_PASSWORD: dopx_test
      DB_HOST: localhost
      DB_PORT: "5432"
      REDIS_URL: redis://localhost:6379/1
      REDIS_AGGREGATES_URL: redis://localhost:6379/2
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Django deploy-чеклист (security-настройки)
        # Предупреждения DEBUG/SECRET_KEY/HTTPS здесь ожидаемы (development).
        run: python manage.py check --deploy

      - name: Проверка расхождения моделей и миграций
        # Ловит забытые миграции.
        run: python manage.py makemigrations --check --dry-run

      - name: manage.py test
        run: python manage.py test

      - name: pip-audit (известные уязвимости в зависимостях)
        # pip-audit пока не блокирует — бывают ложные срабатывания.
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  production-settings-check:
    name: Django deploy-чеклист под ПРОД-настройками
    runs-on: ubuntu-latest
    # check --deploy с прод-настройками (DEBUG=False): ловит ослабление безопасности в settings.py.
    # БД и кэш не нужны.
    env:
      ENVIRONMENT: production
      DEBUG: "False"
      # Тестовый ключ реалистичной длины и энтропии.
      SECRET_KEY: "ci-only-production-settings-check-3f8a1c9e7b2d4f60a5e9c1b7d3f082ea"
      ALLOWED_HOSTS: "dopx.kz,www.dopx.kz"
      DB_NAME: dopx_ci_placeholder
      DB_USER: dopx_ci_placeholder
      DB_PASSWORD: dopx_ci_placeholder
      DB_HOST: localhost
      DB_PORT: "5432"
      REDIS_URL: redis://localhost:6379/1
      REDIS_AGGREGATES_URL: redis://localhost:6379/2
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      SECURE_SSL_REDIRECT: "True"
      SITE_URL: https://dopx.kz
      CSRF_TRUSTED_ORIGINS: https://dopx.kz,https://www.dopx.kz
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Django deploy-чеклист под прод-настройками (должен пройти без предупреждений)
        run: python manage.py check --deploy --fail-level WARNING

  deploy:
    name: Деплой на сервер
    needs: [build-check, test, production-settings-check]
    runs-on: ubuntu-latest
    # Деплой только из main. Откат на тег (inputs.ref) не ждёт зелёных проверок main:
    # он нужен как раз тогда, когда в main что-то сломано.
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      ((github.event_name == 'workflow_dispatch' && inputs.ref != '') ||
      (needs.build-check.result == 'success' && needs.test.result == 'success' && needs.production-settings-check.result == 'success')) }}
    # Деплои идут строго по очереди, новый не отменяет начатый.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.SITE_URL || 'https://dopx.kz' }}
    timeout-minutes: 25
    # Создание тега и релиза.
    permissions:
      contents: write
    steps:
      - name: Checkout (вся история и теги — для номера версии)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Что выкатываем
        id: target
        env:
          REF: ${{ inputs.ref }}
        run: |
          if [ -n "$REF" ]; then
            # Только тег версии или хеш коммита — никаких произвольных строк.
            if ! echo "$REF" | grep -Eq '^(v[0-9]+\.[0-9]+\.[0-9]+|[0-9a-f]{7,40})$'; then
              echo "Недопустимый ref: $REF"; exit 1
            fi
            sha=$(git rev-parse "$REF^{commit}")
          else
            sha="$GITHUB_SHA"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Выкатываем $sha${REF:+ (откат на $REF)}"

      - name: Следующая версия
        id: version
        env:
          TARGET: ${{ steps.target.outputs.sha }}
        run: |
          # Коммит уже помечен (повторный запуск или откат на тег) — берём его версию.
          existing=$(git tag --points-at "$TARGET" --list 'v[0-9]*' | head -1)
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$TARGET" 2>/dev/null || true)
          if [ -n "$existing" ]; then
            next="${existing#v}"
          elif [ -z "$last" ]; then
            next="1.0.0"
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            messages=$(git log "$last..$TARGET" --format=%B)
            if echo "$messages" | grep -qi '\[major\]'; then
              next="$((major + 1)).0.0"
            elif echo "$messages" | grep -qi '\[minor\]'; then
              next="$major.$((minor + 1)).0"
            else
              next="$major.$minor.$((patch + 1))"
            fi
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Версия этого деплоя: $next (предыдущая: ${last:-нет})"

      - name: Проверить, настроены ли секреты деплоя
        id: check
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Пропуск (сервер ещё не подключён)
        if: steps.check.outputs.configured == 'false'
        run: |
          echo "DEPLOY_HOST не задан в секретах репозитория — деплой пропущен."
          echo "Это ожидаемо, пока нет сервера. См. docs/DEPLOYMENT.md, раздел «GitHub»."

      - name: Деплой по SSH (scripts/deploy.sh)
        if: steps.check.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        # DEPLOY_PATH через envs — секрет не попадает в текст команды.
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
          DEPLOY_VERSION: ${{ steps.version.outputs.version }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: DEPLOY_PATH,DEPLOY_SHA,DEPLOY_VERSION
          command_timeout: 20m
          script: |
            set -e
            cd "$DEPLOY_PATH"
            # Скрипт берём из нового коммита: так изменения самого деплоя применяются сразу.
            git fetch --quiet origin main
            git show "$DEPLOY_SHA:scripts/deploy.sh" > /tmp/dopx-deploy.sh
            DEPLOY_ROOT="$DEPLOY_PATH" DEPLOY_VERSION="$DEPLOY_VERSION" bash /tmp/dopx-deploy.sh "$DEPLOY_SHA"

      - name: Тег и релиз vX.Y.Z
        # Только после успешного деплоя: откаченная версия номер не получает.
        if: steps.check.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ steps.target.outputs.sha }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Релиз v$VERSION уже есть."
          else
            gh release create "v$VERSION" --target "$TARGET" --title "v$VERSION" --generate-notes
          fi

      - name: Итог в GitHub
        if: always() && steps.check.outputs.configured == 'true'
        env:
          TARGET: ${{ steps.target.outputs.sha }}
        run: |
          {
            echo "### Версия ${{ steps.version.outputs.version }} (${TARGET::7}): ${{ job.status == 'success' && '✅ на проде' || '❌ не выкачена' }}"
            echo "Подробный лог на сервере: logs/deploy/, журнал — дашборд → Системный статус."
          } >> "$GITHUB_STEP_SUMMARY"

  notify-failure:
    name: Уведомление о сбое проверок
    needs: [build-check, test, production-settings-check]
    if: failure() && github.ref == 'refs/heads/main' && !(github.event_name == 'workflow_dispatch' && inputs.ref != '')
    runs-on: ubuntu-latest
    steps:
      - name: Telegram
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ] || exit 0
          curl -fsS "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=🧪 DOPX: проверки коммита ${GITHUB_SHA::7} не прошли, деплой не запускался. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
