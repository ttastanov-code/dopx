# .github/workflows/deploy.yml
#
# На push в main/dev и PR: сборка образа, тесты на Postgres/Redis, deploy-чеклист.
# Если всё прошло и это push в main — деплой по SSH.
# Без секретов DEPLOY_HOST/DEPLOY_USER/DEPLOY_SSH_KEY/DEPLOY_PATH деплой пропускается.

name: Build check & deploy

on:
  push:
    branches:
      - main
      - dev
  # Проверки и на PR. Деплой на PR не запустится: github.ref там refs/pull/N/merge.
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch: {}

jobs:
  build-check:
    name: Проверка сборки Docker-образа
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Собрать образ web (без запуска)
        run: docker build -t dopx-build-check .

  test:
    name: Тесты + Django deploy-чеклист
    runs-on: ubuntu-latest
    # Postgres/Redis прямо на раннере — проверяем код, Dockerfile проверяет build-check.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dopx_test
          POSTGRES_USER: dopx_test
          POSTGRES_PASSWORD: dopx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dopx_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Тестовые значения, не секреты. ENVIRONMENT=development — не требуем прод-SECRET_KEY.
      ENVIRONMENT: development
      DEBUG: "True"
      SECRET_KEY: ci-test-secret-key-not-for-production-use
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      DB_NAME: dopx_test
      DB_USER: dopx_test
      DB_PASSWORD: dopx_test
      DB_HOST: localhost
      DB_PORT: "5432"
      REDIS_URL: redis://localhost:6379/1
      REDIS_AGGREGATES_URL: redis://localhost:6379/2
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Django deploy-чеклист (security-настройки)
        # Предупреждения DEBUG/SECRET_KEY/HTTPS здесь ожидаемы (development).
        run: python manage.py check --deploy

      - name: Проверка расхождения моделей и миграций
        # Ловит забытые миграции.
        run: python manage.py makemigrations --check --dry-run

      - name: manage.py test
        run: python manage.py test

      - name: pip-audit (известные уязвимости в зависимостях)
        # pip-audit пока не блокирует — бывают ложные срабатывания.
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  production-settings-check:
    name: Django deploy-чеклист под ПРОД-настройками
    runs-on: ubuntu-latest
    # check --deploy с прод-настройками (DEBUG=False): ловит ослабление безопасности в settings.py.
    # БД и кэш не нужны.
    env:
      ENVIRONMENT: production
      DEBUG: "False"
      # Тестовый ключ реалистичной длины и энтропии.
      SECRET_KEY: "ci-only-production-settings-check-3f8a1c9e7b2d4f60a5e9c1b7d3f082ea"
      ALLOWED_HOSTS: "dopx.kz,www.dopx.kz"
      DB_NAME: dopx_ci_placeholder
      DB_USER: dopx_ci_placeholder
      DB_PASSWORD: dopx_ci_placeholder
      DB_HOST: localhost
      DB_PORT: "5432"
      REDIS_URL: redis://localhost:6379/1
      REDIS_AGGREGATES_URL: redis://localhost:6379/2
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      SECURE_SSL_REDIRECT: "True"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Django deploy-чеклист под прод-настройками (должен пройти без предупреждений)
        run: python manage.py check --deploy --fail-level WARNING

  deploy:
    name: Деплой на сервер
    needs: [build-check, test, production-settings-check]
    runs-on: ubuntu-latest
    # Деплой только из main.
    if: github.ref == 'refs/heads/main'
    # Таймаут на весь job — на случай недоступного сервера.
    timeout-minutes: 10
    steps:
      - name: Проверить, настроены ли секреты деплоя
        id: check
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Пропуск (сервер ещё не подключён)
        if: steps.check.outputs.configured == 'false'
        run: |
          echo "DEPLOY_HOST не задан в секретах репозитория — деплой пропущен."
          echo "Это ожидаемо, пока нет сервера. См. docs/DEPLOYMENT.md, раздел про CI/CD."

      - name: Деплой по SSH
        if: steps.check.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        # DEPLOY_PATH через envs — секрет не попадает в текст команды.
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: DEPLOY_PATH
          script: |
            set -e
            cd "$DEPLOY_PATH"
            git pull origin main

            # Сборка отдельно от запуска — при ошибке сайт остаётся на старом образе.
            docker compose build web celery celery-beat

            # Миграции отдельным шагом до перезапуска web; при ошибке set -e останавливает деплой.
            docker compose run --rm web python manage.py migrate --noinput

            docker compose up -d --build
            docker image prune -f

            # Смоук-тест: сайт реально отвечает. Ретраи — время на холодный старт.
            for i in 1 2 3 4 5; do
              if curl -fsS -o /dev/null "http://localhost:8000/admin/login/"; then
                echo "Смоук-тест пройден"
                exit 0
              fi
              echo "Смоук-тест: попытка $i не удалась, жду 5с..."
              sleep 5
            done
            echo "Смоук-тест не пройден после 5 попыток — сайт не отвечает на новом коде"
            exit 1
