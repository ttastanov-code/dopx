{% comment %}
Компактный виджет прогноза для карточки в списке матчей (POST с compact=1).
Контекст: match, counts, my_prediction. Клик не всплывает к ссылке карточки.
{% endcomment %}
<div id="prediction-widget-{{ match.id }}"
     class="grid grid-cols-3 gap-1 sm:gap-1.5 mt-2 pt-2 border-t border-base-300"
     onclick="event.stopPropagation()">
    <button type="button"
            {% if match.is_prediction_open %}
            hx-post="{% url 'predictions:predict' match.id %}"
            hx-vals='{"choice": "1", "compact": "1"}'
            hx-target="#prediction-widget-{{ match.id }}"
            hx-swap="outerHTML"
            {% else %}
            disabled
            {% endif %}
            class="flex flex-col items-center gap-0.5 py-1 px-1 rounded-lg border transition-all
                   {% if match.final_result == '1' %}border-success bg-success/10
                   {% elif my_prediction.choice == '1' %}border-primary bg-primary/5
                   {% else %}border-base-300{% endif %}">
        <span class="text-[9px] font-semibold opacity-60 truncate max-w-full">П1</span>
        <span class="text-xs font-bold">{{ counts.home_pct }}%</span>
    </button>
    <button type="button"
            {% if match.is_prediction_open %}
            hx-post="{% url 'predictions:predict' match.id %}"
            hx-vals='{"choice": "X", "compact": "1"}'
            hx-target="#prediction-widget-{{ match.id }}"
            hx-swap="outerHTML"
            {% else %}
            disabled
            {% endif %}
            class="flex flex-col items-center gap-0.5 py-1 px-1 rounded-lg border transition-all
                   {% if match.final_result == 'X' %}border-success bg-success/10
                   {% elif my_prediction.choice == 'X' %}border-primary bg-primary/5
                   {% else %}border-base-300{% endif %}">
        <span class="text-[9px] font-semibold opacity-60">Х</span>
        <span class="text-xs font-bold">{{ counts.draw_pct }}%</span>
    </button>
    <button type="button"
            {% if match.is_prediction_open %}
            hx-post="{% url 'predictions:predict' match.id %}"
            hx-vals='{"choice": "2", "compact": "1"}'
            hx-target="#prediction-widget-{{ match.id }}"
            hx-swap="outerHTML"
            {% else %}
            disabled
            {% endif %}
            class="flex flex-col items-center gap-0.5 py-1 px-1 rounded-lg border transition-all
                   {% if match.final_result == '2' %}border-success bg-success/10
                   {% elif my_prediction.choice == '2' %}border-primary bg-primary/5
                   {% else %}border-base-300{% endif %}">
        <span class="text-[9px] font-semibold opacity-60 truncate max-w-full">П2</span>
        <span class="text-xs font-bold">{{ counts.away_pct }}%</span>
    </button>
</div>
