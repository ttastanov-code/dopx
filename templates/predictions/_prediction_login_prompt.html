{% comment %}Возвращается вместо _prediction_widget.html, если голосует неавторизованный пользователь — тот же паттерн, что events/_reaction_login_prompt.html.{% endcomment %}
<div id="prediction-widget-{{ match.id }}" class="card bg-base-100 border border-base-300 mt-3 sm:mt-6">
    <div class="card-body p-3 sm:p-4 items-center text-center gap-2">
        <i class="ti ti-chart-bar text-2xl text-primary"></i>
        <p class="text-xs sm:text-sm opacity-70">Войдите, чтобы сделать прогноз на матч</p>
        <a href="{% url 'users:login' %}" class="btn btn-primary btn-xs sm:btn-sm">
            <i class="ti ti-login"></i> Войти
        </a>
    </div>
</div>
