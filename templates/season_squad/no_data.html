{% extends 'base.html' %}
{% block content %}
{# «Пока нет данных» вместо 404, когда нет активного сезона. #}
<div class="max-w-lg mx-auto text-center py-20 px-4">
  <div class="w-16 h-16 rounded-full bg-base-200 flex items-center justify-center mx-auto mb-4">
    <i class="ti ti-shirt text-3xl opacity-60"></i>
  </div>
  <h1 class="text-xl font-bold mb-2">{{ title }}</h1>
  <p class="opacity-60">{{ message }}</p>
  <a href="{% url 'core:home' %}" class="btn btn-outline btn-sm mt-6">
    <i class="ti ti-arrow-left"></i> На главную
  </a>
</div>
{% endblock %}
