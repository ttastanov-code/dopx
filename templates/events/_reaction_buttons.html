{% load math_extras %}
{% comment %}
Кнопки 👍/👎 одного события. Внутри _live_pulse.html и как ответ на events:react.
Контекст: event, counts, user_reactions.
{% endcomment %}
{% with c=counts|get_item:event.id my_reaction=user_reactions|get_item:event.id %}
<div id="reaction-{{ event.id }}" class="flex items-center gap-1.5 flex-shrink-0">
    <button type="button"
            hx-post="{% url 'events:react' event.id %}"
            hx-vals='{"reaction": "like"}'
            hx-target="#reaction-{{ event.id }}"
            hx-swap="outerHTML"
            class="btn btn-xs {% if my_reaction == 'like' %}btn-success{% else %}btn-ghost{% endif %} gap-1 px-2"
            aria-pressed="{% if my_reaction == 'like' %}true{% else %}false{% endif %}">
        <span>👍</span><span class="font-mono">{{ c.like|default:0 }}</span>
    </button>
    <button type="button"
            hx-post="{% url 'events:react' event.id %}"
            hx-vals='{"reaction": "dislike"}'
            hx-target="#reaction-{{ event.id }}"
            hx-swap="outerHTML"
            class="btn btn-xs {% if my_reaction == 'dislike' %}btn-error{% else %}btn-ghost{% endif %} gap-1 px-2"
            aria-pressed="{% if my_reaction == 'dislike' %}true{% else %}false{% endif %}">
        <span>👎</span><span class="font-mono">{{ c.dislike|default:0 }}</span>
    </button>
</div>
{% endwith %}
