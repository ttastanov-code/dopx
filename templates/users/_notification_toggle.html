{# Строка-тумблер настройки уведомления. Параметры: field, icon. #}
<label for="{{ field.id_for_label }}" class="flex items-center justify-between gap-3 p-3 rounded-xl hover:bg-base-200 transition-colors cursor-pointer">
    <div class="flex items-center gap-3 flex-1 min-w-0">
        <div class="w-9 h-9 rounded-lg bg-base-200 flex items-center justify-center flex-shrink-0">
            <i class="ti {{ icon }} text-base opacity-70"></i>
        </div>
        <div class="flex-1 min-w-0">
            <div class="font-medium text-sm sm:text-base leading-snug">{{ field.label }}</div>
            {% if field.help_text %}<p class="text-xs opacity-60 mt-0.5 leading-snug">{{ field.help_text }}</p>{% endif %}
        </div>
    </div>
    <span class="flex-shrink-0">{{ field }}</span>
</label>
