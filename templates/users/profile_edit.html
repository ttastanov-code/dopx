{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-6">
        <a href="{% url 'users:profile' %}" class="btn btn-ghost btn-sm">
            <i class="ti ti-arrow-left"></i>
            Назад к профилю
        </a>
    </div>
    
    <div class="card bg-base-100 border border-base-300">
        <div class="card-body p-6">
            <h1 class="text-2xl font-bold mb-6">Редактирование профиля</h1>
            
            <form method="post" enctype="multipart/form-data" class="space-y-4">
                {% csrf_token %}
                
                {% for field in form %}
                <div class="form-control">
                    <label class="label">
                        <span class="label-text font-medium">{{ field.label }}</span>
                    </label>
                    {{ field }}
                    {% if field.errors %}
                    <label class="label">
                        <span class="label-text-alt text-error">{{ field.errors.0 }}</span>
                    </label>
                    {% endif %}
                    {% if field.help_text %}
                    <label class="label">
                        <span class="label-text-alt opacity-60">{{ field.help_text }}</span>
                    </label>
                    {% endif %}
                </div>
                {% endfor %}
                
                <div class="pt-4">
                    <button type="submit" class="btn btn-primary w-full">
                        <i class="ti ti-check"></i>
                        Сохранить изменения
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
