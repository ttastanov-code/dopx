{% if enabled %}
{# Виджет Telegram: после подтверждения возвращает на auth_url с подписанными данными. #}
<div class="flex flex-col items-center gap-2 my-3">
    <script async src="https://telegram.org/js/telegram-widget.js?22" data-telegram-login="{{ bot }}" data-size="large"
            data-radius="12" data-auth-url="{{ auth_url }}" data-request-access="write"></script>
    <span class="text-[11px] opacity-50">Регистрация не нужна — аккаунт создастся сам</span>
</div>
{% endif %}
