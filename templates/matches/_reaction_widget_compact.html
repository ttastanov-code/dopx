{% comment %}
Реакция на матч: Матч тура / Неожиданно / Скучно (hx-swap=outerHTML).
Контекст: match, counts, my_reaction. Клик не всплывает к ссылке карточки.
При total=0 — «—» вместо 0%.
{% endcomment %}
<div id="reaction-widget-{{ match.id }}"
     class="mt-2 pt-2 border-t border-base-300"
     onclick="event.stopPropagation()">
    <div class="text-[9px] font-semibold opacity-50 mb-1">
        {% if counts.total %}Мнение болельщиков{% else %}Оцените матч первым{% endif %}
    </div>
    <div class="grid grid-cols-3 gap-1 sm:gap-1.5">
    <button type="button"
            hx-post="{% url 'matches:react' match.id %}"
            hx-vals='{"reaction": "match_of_round"}'
            hx-target="#reaction-widget-{{ match.id }}"
            hx-swap="outerHTML"
            title="Один из лучших матчей тура"
            class="flex flex-col items-center gap-0.5 py-1 px-1 rounded-lg border transition-all
                   {% if my_reaction.reaction == 'match_of_round' %}border-success bg-success/10{% else %}border-base-300{% endif %}">
        <i class="ti ti-trophy text-xs"></i>
        <span class="text-[9px] font-semibold opacity-60 truncate max-w-full">Матч тура</span>
        <span class="text-xs font-bold">{% if counts.total %}{{ counts.match_of_round_pct }}%{% else %}—{% endif %}</span>
    </button>
    <button type="button"
            hx-post="{% url 'matches:react' match.id %}"
            hx-vals='{"reaction": "upset"}'
            hx-target="#reaction-widget-{{ match.id }}"
            hx-swap="outerHTML"
            title="Результат стал неожиданностью"
            class="flex flex-col items-center gap-0.5 py-1 px-1 rounded-lg border transition-all
                   {% if my_reaction.reaction == 'upset' %}border-warning bg-warning/10{% else %}border-base-300{% endif %}">
        <i class="ti ti-bolt text-xs"></i>
        <span class="text-[9px] font-semibold opacity-60 truncate max-w-full">Неожиданно</span>
        <span class="text-xs font-bold">{% if counts.total %}{{ counts.upset_pct }}%{% else %}—{% endif %}</span>
    </button>
    <button type="button"
            hx-post="{% url 'matches:react' match.id %}"
            hx-vals='{"reaction": "boring"}'
            hx-target="#reaction-widget-{{ match.id }}"
            hx-swap="outerHTML"
            title="Матч получился скучным"
            class="flex flex-col items-center gap-0.5 py-1 px-1 rounded-lg border transition-all
                   {% if my_reaction.reaction == 'boring' %}border-neutral bg-neutral/10{% else %}border-base-300{% endif %}">
        <i class="ti ti-moon text-xs"></i>
        <span class="text-[9px] font-semibold opacity-60 truncate max-w-full">Скучный</span>
        <span class="text-xs font-bold">{% if counts.total %}{{ counts.boring_pct }}%{% else %}—{% endif %}</span>
    </button>
    </div>
</div>
