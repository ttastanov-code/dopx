{# Звание у ника (engagement_extras.user_title): size "icon" — только мини-медаль (тесные таблицы). Медаль — css/ui.css (dx-medal). #}
{% if title %}{% if size == "icon" %}<span class="dx-medal dx-medal--{{ title.rarity }} dx-medal--xs dx-title-icon" title="Достижение «{{ title.name }}»" aria-label="Достижение «{{ title.name }}»"><i class="ti ti-{{ title.icon }}"></i></span>{% else %}<span class="dx-title dx-title--{{ title.rarity }} dx-title--{{ size }}" title="Достижение «{{ title.name }}»"><span class="dx-medal dx-medal--{{ title.rarity }}" aria-hidden="true"><i class="ti ti-{{ title.icon }}"></i></span>{{ title.name }}</span>{% endif %}{% endif %}
