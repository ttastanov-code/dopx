{# Бейдж надёжности рейтинга. Только через {% confidence_badge agg %} (rating_extras). #}
{% if show %}
{# shrink-0 — бейдж не сжимается. #}
<span class="inline-flex items-center gap-1 align-middle shrink-0">
    <a href="{% url 'core:anti_fraud' %}#rating-confidence"
       class="badge badge-xs md:badge-sm {{ badge_class }} whitespace-nowrap no-underline hover:opacity-80"
       title="Как считается надёжность рейтинга">{{ tier_label }}</a>
    {% if tooltip_text %}{% include 'components/_tooltip_icon.html' with text=tooltip_text %}{% endif %}
</span>
{% endif %}
