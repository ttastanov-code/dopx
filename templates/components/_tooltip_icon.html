{% comment %}
Подсказка-иконка. Параметр text — текст подсказки.
Ставить рядом с лейблом, не оборачивать его.
Внутри этого комментария не писать шаблонные теги — движок их парсит.
{% endcomment %}
{% if text %}
{# Текст в data-tooltip-text, не аргументом x-data. #}
<span class="relative inline-flex align-middle"
      x-data="tooltipTrigger"
      data-tooltip-text="{{ text }}"
      @click.outside="hide()">
    <button type="button"
            x-ref="trigger"
            @mouseenter="show()"
            @mouseleave="hide()"
            @click.stop.prevent="show()"
            @focus="show()"
            @blur="hide()"
            class="inline-flex items-center justify-center w-4 h-4 shrink-0 rounded-full opacity-50 hover:opacity-100 focus:opacity-100 transition-opacity"
            aria-label="Подробнее">
        <i class="ti ti-info-circle text-[13px] leading-none"></i>
    </button>
    <template x-teleport="body">
        {# Видимость через display в :style — x-show на телепортированном узле ненадёжен. #}
        <div x-ref="bubble"
             x-cloak
             :style="{ position: 'fixed', top: pos.top + 'px', left: pos.left + 'px', display: open ? 'block' : 'none' }"
             class="z-[9999] max-w-[280px] rounded-md bg-neutral text-neutral-content text-xs leading-snug px-2.5 py-2 shadow-lg pointer-events-none">
            {# white-space: pre-line — переносы \n в тексте сохраняются. #}
            <span x-text="text" style="white-space: pre-line;"></span>
        </div>
    </template>
</span>
{% endif %}
