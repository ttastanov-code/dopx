{% comment %}
Логотип DOPX (навбар и футер): плитка со знаком «Мяч-шкала» + текст.
Геометрия знака — scripts/build_brand_assets.py.
Параметры: variant (обязателен, уникальный id градиента), icon_size, text_size.
{% endcomment %}
<div class="flex items-center gap-2 min-w-0">
    <svg viewBox="0 0 48 48" class="{{ icon_size|default:'h-7 w-7 sm:h-8 sm:w-8' }} shrink-0 dx-brand-mark" aria-hidden="true">
        <defs><linearGradient id="dopxGradient-{{ variant }}" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#4F6BFF"/><stop offset="1" stop-color="#9333EA"/></linearGradient></defs><rect width="48" height="48" rx="13" fill="url(#dopxGradient-{{ variant }})"/><g transform="translate(4.8 4.8) scale(0.8)"><circle cx="24" cy="24" r="17" fill="none" stroke="#fff" stroke-width="3" opacity=".35"/><path d="M11.98 36.02 A17 17 0 1 1 37.02 13.07" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><circle cx="37.02" cy="13.07" r="5.2" fill="url(#dopxGradient-{{ variant }})" stroke="#fff" stroke-width="3.2"/><path d="M24 17.5 L30.2 22 L27.8 29.3 L20.2 29.3 L17.8 22 Z" fill="#fff"/></g>
    </svg>
    <span class="{{ text_size|default:'text-base sm:text-lg' }} font-extrabold tracking-tight leading-none whitespace-nowrap">DOPX</span>
</div>
