{% comment %}
Логотип DOPX (навбар и футер): SVG-значок + текст.
Параметры: variant (обязателен, уникальный id градиента), icon_size, text_size.
{% endcomment %}
<div class="flex items-center gap-2 min-w-0">
    <svg viewBox="0 0 32 32" class="{{ icon_size|default:'h-7 w-7 sm:h-8 sm:w-8' }} shrink-0" aria-hidden="true">
        <rect width="32" height="32" rx="9" fill="url(#dopxGradient-{{ variant }})"></rect>
        <rect x="7.4" y="14" width="3.6" height="10.5" rx="1.8" fill="white" fill-opacity="0.95"></rect>
        <rect x="14.2" y="7.4" width="3.6" height="17.1" rx="1.8" fill="white"></rect>
        <rect x="21" y="11" width="3.6" height="13.5" rx="1.8" fill="white" fill-opacity="0.95"></rect>
        <defs>
            <linearGradient id="dopxGradient-{{ variant }}" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#4F6BFF"></stop>
                <stop offset="1" stop-color="#9333EA"></stop>
            </linearGradient>
        </defs>
    </svg>
    <span class="{{ text_size|default:'text-base sm:text-lg' }} font-extrabold tracking-tight leading-none whitespace-nowrap">DOPX</span>
</div>
