{% load static %}
<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ team.name }} · рейтинг DOPX</title>
    {% comment %}
    Второй embed-виджет после players/widget.html (продуктовый аудит "канал
    привлечения", 2026-08-21) — тот же изолированный документ без base.html,
    те же причины: грузится в <iframe> на стороннем сайте (клубный паблик).
    {% endcomment %}
    {% comment %}
    Версии и SRI-хэши те же, что в base.html (см. scripts/generate_sri.sh) —
    было @4/@5/@latest без integrity вообще: плавающий тег отдаёт другой
    файл без предупреждения, а виджет встраивается на СТОРОННИХ сайтах
    (iframe), где подмену CDN-файла некому заметить. Обновлять версию здесь
    и в base.html/base_auth.html синхронно.
    {% endcomment %}
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3" integrity="sha384-aJ9rL4k6lF+91guGvUFVSkpIcge7Zd9EiI4TQDLoK9kFaFJgKHgjEXVvG/qA5COj" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5.7.17" rel="stylesheet" type="text/css" integrity="sha384-39M1LQqzp+SSirSevKD4gsadFB7kgKzMiPY7o6hVhOXuRthgtd1oohKwlosU9KHi" crossorigin="anonymous" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5.7.17/themes.css" rel="stylesheet" type="text/css" integrity="sha384-HhSoSsQclUlsqy8Gyz+E2oVSebHT4dv3MJ+NdUjV9mh1twUK4UPKQgmj0dHDKe0Y" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css" integrity="sha384-ND+q1IVc0KDElX60dZaqKc7Xl9cdxd2PpU2JfVUHcurCkFVtVLFdt9vJfxtHSL3p" crossorigin="anonymous">
    <style>html,body{margin:0;padding:0;background:transparent}</style>
</head>
<body class="p-2">
    <a href="{% url 'teams:detail' team.id %}" target="_blank" rel="noopener"
       class="card bg-base-100 border border-base-300 shadow-sm hover:shadow-md transition-shadow no-underline text-inherit"
       style="width:300px">
        <div class="card-body p-3 gap-2">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-full bg-primary/10 flex items-center justify-center text-primary flex-shrink-0 overflow-hidden">
                    {% if team.logo_url %}
                    <img src="{{ team.logo_url }}" alt="{{ team.name }}" class="w-full h-full object-contain">
                    {% else %}
                    <i class="ti ti-shield text-xl"></i>
                    {% endif %}
                </div>
                <div class="min-w-0">
                    <div class="font-bold text-sm truncate">{{ team.name }}</div>
                    <div class="text-xs opacity-60 truncate">Оценка болельщиков DOPX</div>
                </div>
            </div>
            <div class="flex items-center justify-between pt-1 border-t border-base-200">
                <span class="text-xs opacity-60">Рейтинг команды</span>
                {% if has_enough_votes %}
                    <span class="font-bold text-lg text-success">{{ avg_score }}</span>
                {% else %}
                    <span class="badge badge-ghost badge-sm">н/д</span>
                {% endif %}
            </div>
            <div class="flex items-center justify-between text-[10px] opacity-50">
                <span>{{ total_votes }} голосов</span>
                <span class="flex items-center gap-1 font-semibold"><i class="ti ti-external-link"></i> DOPX</span>
            </div>
        </div>
    </a>
</body>
</html>
