{# CTA-кнопка: button_url, button_label, button_color. bgcolor — для Outlook. #}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin: 4px auto 0;">
    <tr>
        <td align="center" bgcolor="{{ button_color|default:'#6366F1' }}" style="background-color: {{ button_color|default:'#6366F1' }}; border-radius: 8px;">
            <a href="{{ button_url }}" target="_blank" style="display: inline-block; padding: 14px 32px; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; color: #FFFFFF; text-decoration: none; border-radius: 8px;">{{ button_label }}</a>
        </td>
    </tr>
</table>
