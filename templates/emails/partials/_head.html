{% comment %}
Общий head для всех писем.
В комментариях писем нельзя писать шаблонные теги и закрывающую последовательность комментария.
color-scheme — просим клиенты не применять авто-тёмную тему.
{% endcomment %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title>DOPX</title>
    <!--[if mso]>
    <noscript>
        <xml>
            <o:OfficeDocumentSettings>
                <o:PixelsPerInch>96</o:PixelsPerInch>
            </o:OfficeDocumentSettings>
        </xml>
    </noscript>
    <style>
        table { border-collapse: collapse; }
    </style>
    <![endif]-->
    <style>
        body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
        body { margin: 0; padding: 0; width: 100% !important; background-color: #F4F4F5; }
        /* Мобильные клиенты, поддерживающие <style> (все, кроме Outlook
           desktop) — уже письмо и крупнее тап-зоны, единственное, что
           inline-стили сами по себе дать не могут. */
        @media only screen and (max-width: 600px) {
            .dopx-container { width: 100% !important; }
            .dopx-px { padding-left: 24px !important; padding-right: 24px !important; }
        }
    </style>
</head>
