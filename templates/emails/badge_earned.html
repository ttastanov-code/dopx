<!-- templates/emails/badge_earned.html -->
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px; background: #f5f5f5; }
.container { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.header { background: linear-gradient(135deg, #000 0%, #333 100%); color: #fff; padding: 30px 20px; text-align: center; }
.content { padding: 30px 20px; }
.badge-box { background: #f9fafb; border-left: 4px solid #3b82f6; padding: 15px; margin: 20px 0; border-radius: 0 4px 4px 0; }
.footer { background: #f5f5f5; padding: 20px; text-align: center; font-size: 12px; color: #999; border-top: 1px solid #e0e0e0; }
.button { display: inline-block; padding: 10px 20px; background: #000; color: #fff; text-decoration: none; border-radius: 4px; }
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>🎖️ Новое достижение!</h1>
<p>Поздравляем, {{ user.username }}!</p>
</div>
<div class="content">
<div class="badge-box">
<h2 style="margin: 0 0 10px 0;">{{ badge_name }}</h2>
<p style="margin: 0; color: #666;">Вы получили это достижение за активность на платформе DOPX</p>
</div>
<p>Продолжайте оценивать матчи честно и получайте новые награды!</p>
<p style="text-align: center; margin-top: 30px;">
<a href="{{ site_url }}/users/profile/" class="button">Посмотреть профиль</a>
</p>
</div>
<div class="footer">
<p>© {% now "Y" %} {{ site_name }}. Все права защищены.</p>
<p><a href="{{ site_url }}">Перейти на сайт</a></p>
</div>
</div>
</body>
</html>
