<svg xmlns="http://www.w3.org/2000/svg" width="{{ w }}" height="{{ h }}" viewBox="0 0 {{ w }} {{ h }}">
{% include "cards/_bg.svg" %}
{% include "cards/_header.svg" %}
<g transform="translate(222 330)">
  <circle r="168" fill="none" stroke="#FFFFFF" stroke-opacity=".06"/>
  <circle r="140" fill="none" stroke="url(#ringGrad)" stroke-width="3"/>
  <g filter="url(#shadow)"><circle r="126" fill="url(#glass)" stroke="url(#glassEdge)" stroke-width="1.5"/></g>
  {% if photo %}<clipPath id="phClip"><circle r="122"/></clipPath><image href="{{ photo }}" x="-122" y="-122" width="244" height="244" clip-path="url(#phClip)" preserveAspectRatio="xMidYMid slice"/>
  {% else %}<text y="30" text-anchor="middle" font-family="Inter Display" font-weight="800" font-size="84" fill="#FFFFFF">{{ initials }}</text>{% endif %}
  {% if team_logo %}<g filter="url(#shadow)"><circle cx="98" cy="98" r="40" fill="#0D0D16" stroke="url(#glassEdge)" stroke-width="1.5"/></g><image href="{{ team_logo }}" x="72" y="72" width="52" height="52" preserveAspectRatio="xMidYMid meet"/>{% endif %}
</g>
<text x="432" y="190" font-family="Inter" font-weight="600" font-size="21" fill="#FFFFFF" fill-opacity=".6">Итоги сезона {{ season }}</text>
{% for line in name_lines %}<text x="428" y="{{ line.y }}" font-family="Inter Display" font-weight="800" font-size="{{ name_size }}" fill="#FFFFFF" letter-spacing="-1.6">{{ line.text }}</text>{% endfor %}
<text x="432" y="{{ team_y }}" font-family="Inter" font-weight="600" font-size="24" fill="#FFFFFF" fill-opacity=".55">{{ team }}</text>
{% for s in stats %}
<g filter="url(#shadow)"><rect x="{{ s.x }}" y="388" width="216" height="132" rx="28" fill="url(#glass)" stroke="url(#glassEdge)" stroke-width="1.5"/></g>
<text x="{{ s.cx }}" y="460" text-anchor="middle" font-family="Inter Display" font-weight="800" font-size="{{ s.size }}" fill="{% if forloop.counter == 2 %}url(#accentText){% else %}#FFFFFF{% endif %}" letter-spacing="-1.5">{{ s.value }}</text>
<text x="{{ s.cx }}" y="496" text-anchor="middle" font-family="Inter" font-weight="600" font-size="18" fill="#FFFFFF" fill-opacity=".55">{{ s.label }}</text>
{% endfor %}
{% include "cards/_footer.svg" %}
</svg>
