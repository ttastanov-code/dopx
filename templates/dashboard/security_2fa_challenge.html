{% extends 'base.html' %}

{% block content %}
<div class="max-w-sm mx-auto py-16 px-4">
    <h1 class="text-xl font-bold mb-2 flex items-center gap-2">
        <i class="ti ti-shield-check text-primary"></i> Подтверждение входа
    </h1>
    <p class="text-sm opacity-70 mb-6">
        Введите шестизначный код из приложения-аутентификатора или резервный код,
        если телефон недоступен.
    </p>

    {% if messages %}
    {% for message in messages %}
    <div class="alert {% if message.tags == 'error' %}alert-error{% else %}alert-success{% endif %} mb-4 text-sm">
        {{ message }}
    </div>
    {% endfor %}
    {% endif %}

    <form method="post" class="flex flex-col gap-3">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <input
            type="text" name="token" placeholder="Код из приложения или резервный код" maxlength="16"
            autocomplete="one-time-code" autofocus required
            class="input input-bordered w-full text-center text-lg tracking-widest font-mono">
        <button type="submit" class="btn btn-primary">Подтвердить</button>
    </form>
</div>
{% endblock %}
