{% extends 'base_auth.html' %}
{% load static %}
{% block title %}Сброс пароля · DOPX{% endblock %}
{% block content %}
<div class="w-full max-w-md px-4">
    <div class="card bg-base-100 border border-base-300 shadow-xl">
        <div class="card-body p-8 text-center">
            <div class="w-16 h-16 rounded-full bg-success/20 flex items-center justify-center mx-auto mb-4">
                <i class="ti ti-check text-3xl text-success"></i>
            </div>
            <h1 class="text-2xl font-bold mb-2">Проверьте email</h1>
            <p class="text-sm opacity-60 mb-6">
                Если аккаунт с таким email существует, мы отправили ссылку для сброса пароля.
            </p>
            <a href="{% url 'users:login' %}" class="btn btn-primary w-full">
                Вернуться ко входу
            </a>
        </div>
    </div>
</div>
{% endblock %}
