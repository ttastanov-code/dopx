{% extends 'base_auth.html' %}
{% block content %}
<div class="card bg-base-100 shadow-xl max-w-md mx-auto">
  <div class="card-body items-center text-center">
    <div class="w-16 h-16 rounded-full bg-error/20 flex items-center justify-center mb-4">
      <i class="ti ti-alert-triangle text-error text-3xl"></i>
    </div>
    <h2 class="card-title text-xl mb-2">Ссылка недействительна</h2>
    <p class="text-base-content/70 mb-6">Возможно, срок действия ссылки истёк или аккаунт уже активирован.</p>
    <a href="{% url 'users:register' %}" class="btn btn-outline w-full">Зарегистрироваться снова</a>
  </div>
</div>
{% endblock %}
