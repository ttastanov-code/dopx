{% extends 'base_auth.html' %}
{% load static %}
{% block title %}Сброс пароля — DOPX{% endblock %}
{% block content %}
<div class="w-full max-w-md px-4">
    <div class="card bg-base-100 border border-base-300 shadow-xl">
        <div class="card-body p-8">
            <div class="text-center mb-6">
                <div class="w-16 h-16 rounded-full bg-primary/10 flex items-center justify-center mx-auto mb-4">
                    <i class="ti ti-lock text-3xl text-primary"></i>
                </div>
                <h1 class="text-2xl font-bold">Сброс пароля</h1>
                <p class="text-sm opacity-60 mt-1">Введите email для восстановления</p>
            </div>
            
            <form method="post" class="space-y-4">
                {% csrf_token %}
                
                <div class="form-control">
                    <label class="label">
                        <span class="label-text font-medium">Email</span>
                    </label>
                    <input type="email" name="email" required
                           class="input input-bordered w-full"
                           placeholder="email@example.com">
                </div>
                
                <button type="submit" class="btn btn-primary w-full">
                    <i class="ti ti-send"></i>
                    Отправить инструкцию
                </button>
            </form>
            
            <div class="text-center mt-4">
                <a href="{% url 'users:login' %}" class="link link-primary">
                    Вернуться ко входу
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
