# docker-compose.dev-celery.yml
#
# Только для локальной разработки на маке: celery worker/beat в Linux-контейнере
# (prefork на macOS падает с SIGSEGV). Подключается к локальным Postgres/Redis
# через host.docker.internal. Не запускать вместе с docker-compose.yml
# и с локальным celery из app_venv.
#
#   docker compose -f docker-compose.dev-celery.yml up --build
#   docker compose -f docker-compose.dev-celery.yml down

services:
  celery_worker_dev:
    build:
      context: .
      dockerfile: Dockerfile
    # concurrency=2 — при 4 тяжёлые задачи ловили OOM.
    command: celery -A dopx worker -l info --concurrency=2
    env_file:
      - .env
    environment:
      # localhost внутри контейнера — сам контейнер, поэтому host.docker.internal.
      DB_HOST: host.docker.internal
      DB_PORT: "5432"
      REDIS_URL: redis://host.docker.internal:6379/0
      REDIS_AGGREGATES_URL: redis://host.docker.internal:6379/2
      CELERY_BROKER_URL: redis://host.docker.internal:6379/0
      CELERY_RESULT_BACKEND: redis://host.docker.internal:6379/0
    extra_hosts:
      # host-gateway — на случай нестандартной конфигурации Docker.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./media:/app/media
      - ./logs:/app/logs

  celery_beat_dev:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A dopx beat -l info --schedule=/app/celerybeat/celerybeat-schedule
    env_file:
      - .env
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: "5432"
      REDIS_URL: redis://host.docker.internal:6379/0
      REDIS_AGGREGATES_URL: redis://host.docker.internal:6379/2
      CELERY_BROKER_URL: redis://host.docker.internal:6379/0
      CELERY_RESULT_BACKEND: redis://host.docker.internal:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Свой volume расписания beat, отдельный от прод-стека.
      - celerybeat_data_dev:/app/celerybeat
      - ./logs:/app/logs

volumes:
  celerybeat_data_dev:
