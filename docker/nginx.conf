# docker/nginx.conf
#
# Единственный внешний сервис: /static/ и /media/ с диска, остальное — в gunicorn (web:8000).
# Сейчас только HTTP; блок HTTPS внизу — включить после получения сертификата (docs/DEPLOYMENT.md).

# Схему от aaPanel (TLS там) передаём как есть; напрямую — своя схема.
map $http_x_forwarded_proto $dopx_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Ключ лимитов — настоящий IP посетителя. nginx слушает только 127.0.0.1, перед ним aaPanel
# (ставит X-Real-IP) и, возможно, Cloudflare (CF-Connecting-IP); иначе все запросы были бы «с одного адреса».
map $http_cf_connecting_ip $dopx_client_ip {
    default $http_cf_connecting_ip;
    ""      $dopx_real_ip;
}
map $http_x_real_ip $dopx_real_ip {
    default $http_x_real_ip;
    ""      $remote_addr;
}

# Общий лимит против флуда и строгий — на вход, регистрацию, сброс пароля и формы (в Django свои лимиты тоже есть).
limit_req_zone $dopx_client_ip zone=dopx_general:20m rate=30r/s;
limit_req_zone $dopx_client_ip zone=dopx_auth:10m rate=10r/m;
limit_req_status 429;

upstream dopx_app {
    # web — имя сервиса в docker-compose.yml, 8000 — порт gunicorn.
    server web:8000;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Лимит тела запроса — под загрузку файлов.
    client_max_body_size 20M;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml;

    # --- Статика ---
    # alias — путь после /static/ идёт прямо в /app/staticfiles/.
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # --- Медиа (аватарки, фото игроков, баннеры, share-карточки) ---
    # Вложения обращений — только через Django для staff.
    location /media/contact_attachments/ {
        return 404;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        access_log off;
        # Загруженные файлы не исполняем как страницы сайта.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    }

    # Служебные файлы (.git, .env и т.п.) — никогда; кроме .well-known для сертификата.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # Вход, регистрация, сброс пароля, обращения — строгий лимит.
    location ~ ^/(users/(login|register|password-reset)|admin/login|contacts)/ {
        limit_req zone=dopx_auth burst=10 nodelay;
        proxy_pass http://dopx_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $dopx_forwarded_proto;
        proxy_redirect off;
    }

    # --- Всё остальное — в Django через gunicorn ---
    location / {
        limit_req zone=dopx_general burst=60 nodelay;
        proxy_pass http://dopx_app;
        proxy_http_version 1.1;

        # X-Forwarded-Proto — для SECURE_PROXY_SSL_HEADER.
        # X-Forwarded-For дописывает реальный IP — на нём get_client_ip и антифрод (TRUSTED_PROXY_COUNT).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $dopx_forwarded_proto;
        proxy_redirect off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Для Let's Encrypt HTTP-01 challenge (certbot webroot), понадобится
    # после того как заведёшь SSL — см. docs/DEPLOYMENT.md.
    # location /.well-known/acme-challenge/ {
    #     root /var/www/certbot;
    # }
}

