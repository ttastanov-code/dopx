# docker/nginx.conf
#
# Единственный внешний сервис: /static/ и /media/ с диска, остальное — в gunicorn (web:8000).
# Сейчас только HTTP; блок HTTPS внизу — включить после получения сертификата (docs/DEPLOYMENT.md).

upstream dopx_app {
    # web — имя сервиса в docker-compose.yml, 8000 — порт gunicorn.
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Лимит тела запроса — под загрузку файлов.
    client_max_body_size 20M;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml;

    # --- Статика ---
    # alias — путь после /static/ идёт прямо в /app/staticfiles/.
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # --- Медиа (аватарки, фото игроков, баннеры, share-карточки) ---
    location /media/ {
        alias /app/media/;
        expires 7d;
        access_log off;
    }

    # --- Всё остальное — в Django через gunicorn ---
    location / {
        proxy_pass http://dopx_app;
        proxy_http_version 1.1;

        # X-Forwarded-Proto — для SECURE_PROXY_SSL_HEADER.
        # X-Forwarded-For дописывает реальный IP — на нём get_client_ip и антифрод (TRUSTED_PROXY_COUNT).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Для Let's Encrypt HTTP-01 challenge (certbot webroot), понадобится
    # после того как заведёшь SSL — см. docs/DEPLOYMENT.md.
    # location /.well-known/acme-challenge/ {
    #     root /var/www/certbot;
    # }
}

