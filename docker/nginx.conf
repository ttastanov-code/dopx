# docker/nginx.conf
#
# nginx — единственный сервис, торчащий наружу (см. docker-compose.yml).
# Отдаёт /static/ и /media/ напрямую с диска (volume, общий с web-контейнером),
# всё остальное проксирует в gunicorn (web:8000).
#
# Сейчас настроен только HTTP (порт 80) — этого достаточно, чтобы сайт
# заработал сразу после `docker compose up`. Блок для HTTPS закомментирован
# внизу — раскомментировать после получения сертификата (см. docs/DEPLOYMENT.md,
# раздел про Let's Encrypt/certbot).

upstream dopx_app {
    # "web" — имя сервиса из docker-compose.yml, Docker сам резолвит его
    # в IP контейнера. 8000 — порт, который слушает gunicorn (см. Dockerfile CMD).
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Максимальный размер тела запроса — с запасом под аватарки/скриншоты
    # в форме "право на ответ" и загрузку баннеров через админку.
    client_max_body_size 20M;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml;

    # --- Статика (CSS/JS/шрифты/логотип/PWA-манифест) ---
    # alias, а не root — путь ПОСЛЕ /static/ подставляется напрямую в
    # /app/staticfiles/, без дублирования "static" в пути на диске.
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # --- Медиа (аватарки, фото игроков, баннеры, share-карточки) ---
    location /media/ {
        alias /app/media/;
        expires 7d;
        access_log off;
    }

    # --- Всё остальное — в Django через gunicorn ---
    location / {
        proxy_pass http://dopx_app;
        proxy_http_version 1.1;

        # Заголовки, на которые опирается сам проект:
        # - X-Forwarded-Proto нужен Django для SECURE_PROXY_SSL_HEADER
        #   (dopx/settings.py) — без него Django думает, что все запросы
        #   идут по HTTP, даже когда снаружи HTTPS, и роняет Secure-cookies.
        # - X-Forwarded-For (именно $proxy_add_x_forwarded_for, ДОПИСЫВАЕТ
        #   реальный IP в конец, а не заменяет) — на этом построена вся
        #   логика core.utils.get_client_ip и антифрод-детекция по IP,
        #   см. TRUSTED_PROXY_COUNT в dopx/settings.py.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Для Let's Encrypt HTTP-01 challenge (certbot webroot), понадобится
    # после того как заведёшь SSL — см. docs/DEPLOYMENT.md.
    # location /.well-known/acme-challenge/ {
    #     root /var/www/certbot;
    # }
}

